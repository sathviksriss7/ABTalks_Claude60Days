<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<style>
  :root{
    --bg-0:#0a0e1a;
    --bg-1:#0f1524;
    --bg-2:#141c30;
    --bg-3:#1b2540;
    --card:#131b30;
    --card-hover:#1a2440;
    --border:#25314f;
    --border-light:#324063;
    --accent:#4f8cff;
    --accent-2:#7c5cff;
    --good:#33d68f;
    --warn:#ffb545;
    --bad:#ff5d6c;
    --text-0:#eef2ff;
    --text-1:#a9b4d4;
    --text-2:#6d7899;
    --shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(79,140,255,0.12), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(124,92,255,0.10), transparent 60%),
      var(--bg-0);
    color:var(--text-0);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  #root{min-height:100vh;}
  .app-shell{
    max-width:1180px;
    margin:0 auto;
    padding:32px 24px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 4px 28px;
    border-bottom:1px solid var(--border);
    margin-bottom:28px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.4px;
    color:var(--text-0);
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 14px rgba(79,140,255,0.8);
  }
  .stepper{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .step-pill{
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    background:var(--bg-2);
    border:1px solid var(--border);
    color:var(--text-2);
    font-weight:600;
    letter-spacing:0.3px;
    white-space:nowrap;
  }
  .step-pill.active{
    background:linear-gradient(135deg, rgba(79,140,255,0.25), rgba(124,92,255,0.25));
    border-color:var(--accent);
    color:var(--text-0);
  }
  .step-pill.done{
    color:var(--good);
    border-color:rgba(51,214,143,0.4);
  }

  h1,h2,h3,h4{font-family:inherit;margin:0;}
  .hero-title{
    font-size:44px;
    font-weight:800;
    letter-spacing:-1px;
    line-height:1.1;
    background:linear-gradient(135deg,#fff, #a9c3ff 60%, #c7b3ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero-sub{
    color:var(--text-1);
    font-size:17px;
    line-height:1.6;
    max-width:620px;
    margin-top:14px;
  }
  .card{
    background:linear-gradient(180deg, var(--card), rgba(19,27,48,0.6));
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--border-light);
    box-shadow:var(--shadow);
  }
  .grid{
    display:grid;
    gap:18px;
  }
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:640px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
    .hero-title{font-size:32px;}
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 26px;
    border-radius:12px;
    border:1px solid transparent;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, opacity .15s ease;
    letter-spacing:0.2px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:white;
    box-shadow:0 10px 30px rgba(79,140,255,0.35);
  }
  .btn-primary:hover{box-shadow:0 14px 36px rgba(124,92,255,0.5); transform:translateY(-2px);}
  .btn-secondary{
    background:var(--bg-2);
    border:1px solid var(--border-light);
    color:var(--text-0);
  }
  .btn-secondary:hover{background:var(--bg-3);}
  .btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none !important;
    box-shadow:none !important;
  }
  .btn-block{width:100%;}

  .label-eyebrow{
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:1.6px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:8px;
  }
  .muted{color:var(--text-1);}
  .faint{color:var(--text-2);}

  .stat-value{font-size:24px;font-weight:800;color:var(--text-0);}
  .stat-label{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.8px;margin-top:4px;}

  .why-box{
    margin-top:14px;
    background:rgba(79,140,255,0.08);
    border:1px solid rgba(79,140,255,0.25);
    border-radius:12px;
    padding:12px 14px;
    font-size:13.5px;
    color:var(--text-1);
    line-height:1.55;
  }
  .why-box b{color:var(--accent);}

  .tag{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .tag-bad{background:rgba(255,93,108,0.15);color:var(--bad);border:1px solid rgba(255,93,108,0.35);}
  .tag-warn{background:rgba(255,181,69,0.15);color:var(--warn);border:1px solid rgba(255,181,69,0.35);}
  .tag-good{background:rgba(51,214,143,0.15);color:var(--good);border:1px solid rgba(51,214,143,0.35);}
  .tag-accent{background:rgba(124,92,255,0.15);color:#bcaaff;border:1px solid rgba(124,92,255,0.35);}

  .progress-row{margin-bottom:16px;}
  .progress-head{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
    color:var(--text-1);
  }
  .progress-head b{color:var(--text-0);}
  .progress-track{
    height:10px;
    border-radius:999px;
    background:var(--bg-2);
    overflow:hidden;
    border:1px solid var(--border);
  }
  .progress-fill{
    height:100%;
    border-radius:999px;
    transition:width 1s cubic-bezier(.22,.9,.32,1.2);
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .progress-fill.good{background:linear-gradient(90deg,#2fb37e,#33d68f);}
  .progress-fill.bad{background:linear-gradient(90deg,#e04a58,#ff5d6c);}
  .progress-fill.warn{background:linear-gradient(90deg,#e0983a,#ffb545);}

  .choice-card{
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--bg-2);
    border-radius:14px;
    padding:18px;
    transition:all .2s ease;
    position:relative;
  }
  .choice-card:hover{border-color:var(--accent); background:var(--card-hover); transform:translateY(-2px);}
  .choice-card.selected{
    border-color:var(--accent);
    background:linear-gradient(180deg, rgba(79,140,255,0.14), rgba(124,92,255,0.06));
    box-shadow:0 0 0 1px var(--accent);
  }
  .choice-card.disabled{opacity:0.35; cursor:not-allowed;}
  .choice-card .num{
    position:absolute;
    top:14px;right:14px;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent);
    color:white;
    font-size:12px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }

  .section-title{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
    margin-bottom:6px;
  }
  .section-sub{
    color:var(--text-1);
    font-size:14.5px;
    margin-bottom:26px;
    line-height:1.6;
    max-width:720px;
  }

  .divider{height:1px;background:var(--border);margin:28px 0;}

  .footer-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:32px;
    gap:14px;
    flex-wrap:wrap;
  }

  .score-ring-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .big-score{
    font-size:56px;
    font-weight:900;
    letter-spacing:-2px;
  }

  .metric-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
  @media (max-width:640px){.metric-grid{grid-template-columns:1fr 1fr;}}

  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .fade-in{animation:fadeIn .5s ease both;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .badge-round{
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(79,140,255,0.14);
    border:1px solid rgba(79,140,255,0.3);
    font-size:16px;
  }

  .log-item{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:13.5px;
    color:var(--text-1);
  }
  .log-item:last-child{border-bottom:none;}
  .log-item b{color:var(--text-0);}

  .kv-line{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px dashed var(--border);
    font-size:13.5px;
  }
  .kv-line:last-child{border-bottom:none;}
  .kv-line span:first-child{color:var(--text-2);}
  .kv-line span:last-child{color:var(--text-0); font-weight:700;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-0);}
  ::-webkit-scrollbar-thumb{background:var(--border-light); border-radius:10px;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ============================= DATA POOLS ============================= */

const INDUSTRIES = [
  "Consumer Electronics", "Automotive Parts", "Pharmaceuticals", "Apparel & Footwear",
  "Home Appliances", "Food & Beverage", "Industrial Equipment", "Furniture Manufacturing",
  "Toys & Games", "Medical Devices"
];

const NAME_PREFIX = ["Vantex","Norlight","Kesa","Brightfold","Ardenne","Solivan","Trueforge","Marrow","Delken","Northbay","Vireo","Cascadia","Orbis","Ferro","Highmark"];
const NAME_SUFFIX = ["Industries","Global","Group","Manufacturing","Holdings","Supply Co.","Corp","Dynamics","Systems","Works"];

const COUNTRIES = ["Vietnam","India","Mexico","Poland","Bangladesh","Indonesia","Turkey","Brazil","Malaysia","South Korea","Thailand","Morocco"];

function rand(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function pickMany(arr, n){
  const copy = [...arr];
  const out = [];
  for(let i=0;i<n && copy.length;i++){
    const idx = rand(0, copy.length-1);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}
function clamp(v, min=0, max=100){ return Math.max(min, Math.min(max, v)); }
function fmtMoney(n){
  return "$" + n.toLocaleString("en-US");
}

function generateCompany(){
  const name = `${pick(NAME_PREFIX)} ${pick(NAME_SUFFIX)}`;
  const industry = pick(INDUSTRIES);
  const revenue = rand(80, 950) * 1000000; // $80M - $950M
  const factories = rand(2, 9);
  const warehouses = rand(3, 14);
  const suppliers = rand(15, 120);
  const inventoryDays = rand(18, 65);
  const leadTime = rand(12, 70);
  const countries = pickMany(COUNTRIES, rand(2,4));
  return { name, industry, revenue, factories, warehouses, suppliers, inventoryDays, leadTime, countries };
}

const CRISES = [
  {
    id: "factory_fire",
    icon: "🔥",
    title: "Factory Fire",
    desc: "A fire has broken out at one of your primary manufacturing plants, halting production lines and damaging finished-goods inventory.",
    urgency: "Critical",
    impactArea: "Production Capacity"
  },
  {
    id: "supplier_bankruptcy",
    icon: "📉",
    title: "Supplier Bankruptcy",
    desc: "Your second-largest raw material supplier has filed for bankruptcy, putting a key input stream at risk overnight.",
    urgency: "High",
    impactArea: "Raw Material Supply"
  },
  {
    id: "port_strike",
    icon: "⚓",
    title: "Port Strike",
    desc: "Dockworkers at a major export port have gone on strike, stranding containers and freezing outbound shipments.",
    urgency: "High",
    impactArea: "Logistics & Shipping"
  },
  {
    id: "cyberattack",
    icon: "🖥️",
    title: "Cyberattack",
    desc: "A ransomware attack has locked your warehouse management and order systems, blinding you to real-time inventory.",
    urgency: "Critical",
    impactArea: "IT & Operations Visibility"
  },
  {
    id: "flood",
    icon: "🌊",
    title: "Regional Flood",
    desc: "Severe flooding has closed key highways and damaged a distribution warehouse in one of your core markets.",
    urgency: "High",
    impactArea: "Distribution Network"
  },
  {
    id: "material_shortage",
    icon: "⛏️",
    title: "Raw Material Shortage",
    desc: "A global shortage of a critical raw material is driving prices up sharply and threatening production schedules.",
    urgency: "Medium",
    impactArea: "Input Cost & Availability"
  },
  {
    id: "political_conflict",
    icon: "🏛️",
    title: "Political Conflict",
    desc: "Escalating political tension in a sourcing region has triggered new tariffs and border delays with little warning.",
    urgency: "High",
    impactArea: "Trade & Compliance"
  },
  {
    id: "shipping_delay",
    icon: "🚢",
    title: "Global Shipping Delay",
    desc: "A container ship backlog at major transshipment hubs is adding weeks to nearly every ocean freight lane you use.",
    urgency: "Medium",
    impactArea: "Delivery Timelines"
  }
];

function generateCrisis(){
  return pick(CRISES);
}

/* ============================= WAR ROOM DATA ============================= */
// Each action affects: cost, inventory, profit, deliverySpeed, customerSat
// Values are deltas applied to a baseline 50 for each metric.
const WAR_ROOM_ACTIONS = [
  {
    id: "expedite_freight",
    title: "Expedite Freight via Air",
    icon: "✈️",
    desc: "Switch stranded shipments to air freight to keep deliveries moving, at a much higher cost.",
    why: "Air freight can restore delivery speed almost immediately, but it is often 4-6x more expensive than ocean or ground shipping — a classic speed-vs-cost trade-off.",
    effects: { cost: -14, inventory: +4, profit: -10, deliverySpeed: +18, customerSat: +12 }
  },
  {
    id: "activate_backup_supplier",
    title: "Activate Backup Supplier",
    icon: "🏭",
    desc: "Bring a pre-vetted secondary supplier online to fill the gap left by the crisis.",
    why: "Diversified sourcing is one of the strongest resilience levers in supply chain management — but backup suppliers are often untested at scale, so quality or lead-time risk can rise.",
    effects: { cost: -6, inventory: +10, profit: +2, deliverySpeed: +6, customerSat: +4 }
  },
  {
    id: "ration_inventory",
    title: "Ration Inventory to Key Customers",
    icon: "📦",
    desc: "Prioritize your highest-value accounts and slow down shipments to smaller customers.",
    why: "This protects your most important revenue relationships in the short term, but customers who get deprioritized often remember it — a real reputational trade-off.",
    effects: { cost: +4, inventory: +8, profit: +6, deliverySpeed: -4, customerSat: -8 }
  },
  {
    id: "communicate_proactively",
    title: "Proactive Customer Communication",
    icon: "📣",
    desc: "Get ahead of the crisis with transparent updates to customers before they have to ask.",
    why: "Research consistently shows that proactive, honest communication during a disruption protects customer trust even when delivery performance suffers — perception matters as much as reality.",
    effects: { cost: -2, inventory: 0, profit: -1, deliverySpeed: 0, customerSat: +14 }
  },
  {
    id: "renegotiate_contracts",
    title: "Renegotiate Supplier Contracts",
    icon: "🤝",
    desc: "Open emergency talks with suppliers to adjust pricing, volumes, or timelines.",
    why: "Renegotiating can relieve cost pressure without cutting service, but it takes time to land — meaning the benefit shows up gradually rather than instantly.",
    effects: { cost: +8, inventory: +2, profit: +8, deliverySpeed: -2, customerSat: +2 }
  },
  {
    id: "build_safety_stock",
    title: "Build Emergency Safety Stock",
    icon: "🛡️",
    desc: "Rush-order extra inventory now to buffer against further disruption.",
    why: "Extra inventory is a reliable insurance policy against uncertainty, but it ties up cash and raises holding costs — the eternal inventory-vs-cash tension in supply chain finance.",
    effects: { cost: -10, inventory: +16, profit: -4, deliverySpeed: +2, customerSat: +6 }
  }
];

/* ============================= NEGOTIATION DATA ============================= */
// 4 rounds, each with options that adjust trust, price(%), leadTime(days)
const NEGOTIATION_ROUNDS = [
  {
    round: 1,
    prompt: "Opening Position",
    context: "Your supplier's account manager opens the call clearly rattled by the crisis. How do you set the tone?",
    why: "The opening move in a negotiation anchors everything that follows — come in too aggressive and you lose goodwill, too soft and you lose leverage.",
    options: [
      { id:"a", label:"Lead with empathy and shared goals", desc:"Acknowledge their situation and frame this as solving the problem together.", trust:+15, price:-2, leadTime:-1 },
      { id:"b", label:"Open with a firm price demand", desc:"State upfront that you expect a 10% discount given the disruption.", trust:-8, price:-6, leadTime:+2 },
      { id:"c", label:"Ask clarifying questions first", desc:"Gather more information before committing to any position.", trust:+5, price:0, leadTime:0 }
    ]
  },
  {
    round: 2,
    prompt: "The Price Squeeze",
    context: "The supplier says raw material costs have risen and they need to pass some of it on to you.",
    why: "Absorbing 100% of a cost increase protects the relationship but hurts your margin; pushing back too hard can damage trust right when you need flexibility most.",
    options: [
      { id:"a", label:"Accept the increase, but ask for longer payment terms", desc:"Trade price for cash-flow flexibility.", trust:+8, price:+5, leadTime:0 },
      { id:"b", label:"Push back and demand they absorb it", desc:"Hold firm on the original pricing.", trust:-12, price:-8, leadTime:+3 },
      { id:"c", label:"Propose splitting the increase 50/50", desc:"Meet in the middle to keep momentum.", trust:+6, price:+2, leadTime:0 }
    ]
  },
  {
    round: 3,
    prompt: "The Lead Time Trade",
    context: "The supplier offers faster delivery if you commit to a larger, longer-term purchase order.",
    why: "Locking in volume can unlock speed and stability, but it also reduces your flexibility if demand shifts or a better supplier emerges later.",
    options: [
      { id:"a", label:"Accept the larger commitment", desc:"Lock in volume for a faster, more reliable lead time.", trust:+10, price:+3, leadTime:-8 },
      { id:"b", label:"Decline and keep orders flexible", desc:"Preserve optionality even if it costs you speed.", trust:0, price:0, leadTime:+2 },
      { id:"c", label:"Counter with a smaller pilot commitment", desc:"Test the relationship before scaling up.", trust:+7, price:+1, leadTime:-3 }
    ]
  },
  {
    round: 4,
    prompt: "Sealing the Deal",
    context: "It's time to close. The supplier is waiting for your final terms.",
    why: "How you close a negotiation shapes the relationship for the entire contract period — a rushed close can leave value on the table or seed resentment.",
    options: [
      { id:"a", label:"Close warmly and confirm next steps in writing", desc:"Lock in trust and clarity for the relationship going forward.", trust:+12, price:0, leadTime:-2 },
      { id:"b", label:"Squeeze for one final concession before signing", desc:"Try to extract a bit more value at the last moment.", trust:-10, price:-4, leadTime:+2 },
      { id:"c", label:"Accept terms as-is to move fast", desc:"Prioritize speed of closing over optimizing further.", trust:+3, price:0, leadTime:0 }
    ]
  }
];

/* ============================= BOARDROOM DATA ============================= */
const BOARDROOM_QUESTIONS = [
  {
    id:1,
    question:"The board asks why the crisis wasn't anticipated. How do you respond?",
    why:"How leaders handle accountability in a crisis shapes whether the organization learns from it or becomes defensive and repeats the same mistake.",
    options:[
      { id:"a", label:"Own the gap and present a concrete plan to close it", score:20, feedback:"Strong. Accountability paired with a plan builds credibility." },
      { id:"b", label:"Explain that this was an unforeseeable, rare event", score:8, feedback:"Partially true, but leaning only on this can look like deflection." },
      { id:"c", label:"Point to the specific team responsible for monitoring risk", score:2, feedback:"Blame-shifting rarely lands well with a board and damages internal trust." },
      { id:"d", label:"Propose an immediate external audit of the risk function", score:14, feedback:"Reasonable, but the board usually wants a direct answer first." }
    ]
  },
  {
    id:2,
    question:"Investors want to know the near-term financial impact. What do you present?",
    why:"Transparent, well-quantified impact estimates are more reassuring to investors than vague optimism — even when the number is bad.",
    options:[
      { id:"a", label:"A detailed range with best/worst case scenarios and mitigation cost", score:20, feedback:"Excellent — ranges show rigor without overpromising precision." },
      { id:"b", label:"A single confident number with no caveats", score:6, feedback:"Risky — false precision can backfire if reality diverges." },
      { id:"c", label:"Say it's too early to estimate anything", score:4, feedback:"Understandable but frustrating for stakeholders who need to plan." },
      { id:"d", label:"Downplay the impact to avoid alarming the market", score:0, feedback:"This erodes trust fast if the truth later comes out." }
    ]
  },
  {
    id:3,
    question:"Your operations lead wants emergency budget approval for backup capacity. Do you approve it?",
    why:"Crisis leadership often means making high-stakes capital decisions under time pressure and incomplete information — this is a defining CEO skill.",
    options:[
      { id:"a", label:"Approve it with a clear ROI review in 90 days", score:20, feedback:"Balanced — decisive action with built-in accountability." },

/* ============================= SHARED UI COMPONENTS ============================= */

function AnimatedBar({ label, value, max=100, tone="default", suffix="" }){
  const [width, setWidth] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setWidth(clamp((value/max)*100, 0, 100)), 80);
    return () => clearTimeout(t);
  }, [value, max]);
  const toneClass = tone === "good" ? "good" : tone === "bad" ? "bad" : tone === "warn" ? "warn" : "";
  return (
    <div className="progress-row">
      <div className="progress-head">
        <span>{label}</span>
        <b>{Math.round(value)}{suffix}</b>
      </div>
      <div className="progress-track">
        <div className={"progress-fill " + toneClass} style={{width: width + "%"}}></div>
      </div>
    </div>
  );
}

function Stepper({ current }){
  const steps = ["Company","Crisis","War Room","Negotiation","Boardroom","AI Strategy","Results"];
  return (
    <div className="stepper">
      {steps.map((s,i) => {
        let cls = "step-pill";
        if(i < current) cls += " done";
        if(i === current) cls += " active";
        return <span key={s} className={cls}>{i+1}. {s}</span>;
      })}
    </div>
  );
}

function TopBar({ step }){
  return (
    <div className="topbar">
      <div className="brand"><span className="dot"></span> OPERATION LIFELINE</div>
      <Stepper current={step} />
    </div>
  );
}

function WarRoom({ company, crisis, onComplete }){

    if(confirmed) return;

      if(prev.length >= 3) return prev;
      return [...prev, id];
    });

    if(selected.length !== 3) return;

          const disabled = confirmed || (!isSel && selected.length >= 3);
          return (
            <div

function Negotiation({ onComplete }){
  const [roundIdx, setRoundIdx] = useState(0);
  const [state, setState] = useState({ trust:50, price:0, leadTime:0 });
  const [history, setHistory] = useState([]);
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [showResult, setShowResult] = useState(false);

  const round = NEGOTIATION_ROUNDS[roundIdx];

  function choose(opt){
    if(showResult) return;
    setSelectedOpt(opt);
  }

  function confirmChoice(){
    if(!selectedOpt) return;
    const next = {
      trust: clamp(state.trust + selectedOpt.trust, 0, 100),
      price: state.price + selectedOpt.price,
      leadTime: state.leadTime + selectedOpt.leadTime
    };
    setState(next);
    setHistory(prev => [...prev, { round: round.round, prompt: round.prompt, choice: selectedOpt.label }]);
    setShowResult(true);
  }

  function nextRound(){
    if(roundIdx < NEGOTIATION_ROUNDS.length - 1){
      setRoundIdx(roundIdx+1);
      setSelectedOpt(null);
      setShowResult(false);
    } else {
      const negotiationScore = clamp(
        Math.round(state.trust * 0.6 + (50 - state.price*2) * 0.2 + (50 - state.leadTime) * 0.2)
      );
      onComplete({ negotiationState: state, negotiationScore, history });
    }
  }

  return (
    <div className="fade-in">
      <div className="label-eyebrow">Step 4 — Supplier Negotiation</div>
      <h2 className="section-title">Round {round.round} of {NEGOTIATION_ROUNDS.length}: {round.prompt}</h2>
      <p className="section-sub">{round.context}</p>

      <div className="why-box" style={{marginBottom:22}}>
        <b>Why this matters:</b> {round.why}
      </div>

      <div className="grid grid-3">
        {round.options.map(opt => (
          <div
            key={opt.id}
            className={"choice-card" + (selectedOpt && selectedOpt.id===opt.id ? " selected" : "") + (showResult && !(selectedOpt && selectedOpt.id===opt.id) ? " disabled" : "")}
            onClick={() => choose(opt)}
          >
            <h4 style={{fontSize:15}}>{opt.label}</h4>
            <p className="muted" style={{fontSize:13, marginTop:8, lineHeight:1.55}}>{opt.desc}</p>
          </div>
        ))}
      </div>

      {!showResult && (
        <div className="footer-actions">
          <div></div>
          <button className="btn btn-primary" disabled={!selectedOpt} onClick={confirmChoice}>Confirm Choice →</button>
        </div>
      )}

      {showResult && (
        <div className="fade-in" style={{marginTop:28}}>
          <div className="divider"></div>
          <h3 style={{fontSize:17, marginBottom:16}}>Running Negotiation Tracker</h3>
          <div className="card">
            <AnimatedBar label="Supplier Trust" value={state.trust} tone={state.trust>=50?"good":"bad"} />
            <div className="kv-line"><span>Cumulative Price Movement</span><span style={{color: state.price<=0 ? "var(--good)":"var(--bad)"}}>{state.price>0?"+":""}{state.price}%</span></div>
            <div className="kv-line"><span>Cumulative Lead Time Change</span><span style={{color: state.leadTime<=0 ? "var(--good)":"var(--bad)"}}>{state.leadTime>0?"+":""}{state.leadTime} days</span></div>
          </div>
          <div className="footer-actions">
            <div></div>
            <button className="btn btn-primary" onClick={nextRound}>
              {roundIdx < NEGOTIATION_ROUNDS.length - 1 ? "Next Round →" : "Proceed to Boardroom →"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

    setLog(prev => [...prev, { q: q.question, choice: selectedOpt.label, feedback: selectedOpt.feedback, score: selectedOpt.score }]);

    if(qIdx < BOARDROOM_QUESTIONS.length - 1){

            {picks.map(p => (
              <div className="card" key={p.id}>
                <div style={{display:"flex", alignItems:"center", gap:10}}>
                  <span style={{fontSize:22}}>{p.icon}</span>
                  <h4 style={{fontSize:15}}>{p.title}</h4>
                </div>
                <div style={{marginTop:14}}>
                  {Object.keys(p.impact).map(k => (
                    <div className="kv-line" key={k}>
                      <span>{k === "deliverySpeed" ? "Delivery Speed" : k === "customerSat" ? "Customer Satisfaction" : k.charAt(0).toUpperCase()+k.slice(1)}</span>
                      <span style={{color: p.impact[k] >= 0 ? "var(--good)" : "var(--bad)"}}>{p.impact[k] > 0 ? "+" : ""}{p.impact[k]}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="footer-actions">
            <div></div>
            <button className="btn btn-primary" onClick={proceed}>See Final Results →</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================= SCREEN: FINAL DASHBOARD ============================= */

function FinalDashboard({ data, onReplay }){
  const { company, crisis, warRoom, negotiation, boardroom, ai } = data;

  // Compute component scores 0-100
  const leadership = boardroom.leadershipScore;
  const negotiationScore = negotiation.negotiationScore;

  const wr = warRoom.metrics;
  const costControl = wr.cost;
  const resilienceBase = Math.round((wr.inventory * 0.5) + (negotiation.negotiationState.trust * 0.3) +
    (ai.aiPicks.reduce((sum,p) => sum + (p.impact.resilience || 6), 0) / ai.aiPicks.length) * 2 * 0.2
  );
  const resilience = clamp(resilienceBase);
  const riskManagement = clamp(Math.round((100 - negotiation.negotiationState.price*2 - Math.max(0,negotiation.negotiationState.leadTime)) * 0.4 + wr.inventory * 0.3 + leadership * 0.3));
  const customerSat = wr.customerSat;

  const overall = clamp(Math.round(
    leadership * 0.2 +
    negotiationScore * 0.2 +
    resilience * 0.2 +
    costControl * 0.15 +
    riskManagement * 0.15 +
    customerSat * 0.10
  ));

  let overallTone = overall >= 75 ? "good" : overall >= 50 ? "warn" : "bad";
  let overallColor = overall >= 75 ? "var(--good)" : overall >= 50 ? "var(--warn)" : "var(--bad)";

  let headline;
  if(overall >= 85) headline = "Exceptional Crisis Leadership";
  else if(overall >= 70) headline = "Strong, Resilient Response";
  else if(overall >= 55) headline = "Solid but Uneven Performance";
  else if(overall >= 40) headline = "A Rocky Response — Room to Grow";
  else headline = "The Crisis Got the Better of You";

  // Biggest mistake detection
  const metricsList = [
    { key:"cost", label:"Cost Control", value: costControl },
    { key:"inventory", label:"Inventory Health", value: wr.inventory },
    { key:"profit", label:"Profit Impact", value: wr.profit },
    { key:"deliverySpeed", label:"Delivery Speed", value: wr.deliverySpeed },
    { key:"customerSat", label:"Customer Satisfaction", value: wr.customerSat },
  ];
  const worstMetric = metricsList.reduce((a,b) => a.value < b.value ? a : b);
  const bestMetric = metricsList.reduce((a,b) => a.value > b.value ? a : b);

  let biggestMistake = "";
  if(worstMetric.value < 45){
    biggestMistake = `Your weakest War Room outcome was ${worstMetric.label} (${Math.round(worstMetric.value)}/100). The combination of actions you chose didn't sufficiently protect this metric.`;
  } else if(negotiation.negotiationState.trust < 45){
    biggestMistake = "Supplier trust ended lower than ideal — some negotiation choices prioritized short-term wins over the long-term relationship.";
  } else if(leadership < 55){
    biggestMistake = "A few boardroom answers leaned toward deflection or slow decision-making rather than owned, decisive leadership.";
  } else {
    biggestMistake = "No major mistake stands out — your weakest area was still reasonably managed, which is a good sign of balanced decision-making.";
  }

  let bestDecision = "";
  if(bestMetric.value >= 55){
    bestDecision = `Your strongest outcome was ${bestMetric.label} (${Math.round(bestMetric.value)}/100), driven by your War Room action choices.`;
  }
  if(negotiation.negotiationState.trust >= 70){
    bestDecision += (bestDecision ? " " : "") + "You also built exceptionally strong supplier trust through the negotiation — that pays dividends long after this crisis ends.";
  }
  if(leadership >= 80){
    bestDecision += (bestDecision ? " " : "") + "Your boardroom answers consistently reflected owned, decisive executive leadership.";
  }
  if(!bestDecision) bestDecision = "Your decisions were fairly balanced across the board without one standout strength — solid, if not spectacular.";

  let expertRecommendation;
  if(resilience < 50){
    expertRecommendation = "Prioritize supplier diversification and safety stock policy work next — your network showed real fragility under pressure.";
  } else if(riskManagement < 50){
    expertRecommendation = "Invest in earlier risk-detection capabilities (like supplier risk monitoring) so the next disruption is caught before it becomes a crisis.";
  } else if(negotiationScore < 50){
    expertRecommendation = "Work on negotiation training focused on maintaining trust under pressure — price and speed matter less if the relationship breaks.";
  } else {
    expertRecommendation = "Keep formalizing what worked here into a documented crisis playbook so the organization can respond just as well without you in the room.";
  }

  const lessons = [
    "Speed and cost are almost always in tension during a live disruption — the right balance depends on how much financial cushion you actually have.",
    "Proactive communication protects customer relationships even when the underlying performance metrics dip.",
    "Trust built during a negotiation compounds — a slightly worse price today can be worth a much stronger partner tomorrow.",
    "AI investments pay off fastest when they target your most fragile link, not just the most exciting technology.",
    "Boards reward leaders who own gaps and present a plan far more than those who look for someone to blame."
  ];

  return (
    <div className="fade-in">
      <div className="label-eyebrow">Step 7 — Final Results</div>
      <h2 className="section-title">{headline}</h2>
      <p className="section-sub">Here's your complete executive scorecard for how you led {company.name} through {crisis.title.toLowerCase()}.</p>

      <div className="card" style={{display:"flex", gap:32, alignItems:"center", flexWrap:"wrap", padding:34}}>
        <div className="score-ring-wrap" style={{width:160, height:160, borderRadius:"50%", border:"10px solid " + overallColor, background:"var(--bg-2)"}}>
          <div style={{textAlign:"center"}}>
            <div className="big-score" style={{color:overallColor}}>{overall}</div>
            <div className="faint" style={{fontSize:12}}>/ 100</div>
          </div>
        </div>
        <div style={{flex:1, minWidth:240}}>
          <h3 style={{fontSize:20}}>Overall Crisis Score</h3>
          <p className="muted" style={{marginTop:8, lineHeight:1.6, fontSize:14}}>
            This blends your leadership, negotiation, resilience, cost control, risk management, and customer satisfaction
            performance into a single measure of how well you steered {company.name} through the {crisis.title.toLowerCase()}.
          </p>
        </div>
      </div>

      <div className="metric-grid" style={{marginTop:22}}>
        <div className="card">
          <AnimatedBar label="Leadership" value={leadership} tone={leadership>=60?"good":leadership>=40?"warn":"bad"} />
        </div>
        <div className="card">
          <AnimatedBar label="Negotiation" value={negotiationScore} tone={negotiationScore>=60?"good":negotiationScore>=40?"warn":"bad"} />
        </div>
        <div className="card">
          <AnimatedBar label="Resilience" value={resilience} tone={resilience>=60?"good":resilience>=40?"warn":"bad"} />
        </div>
        <div className="card">
          <AnimatedBar label="Cost Control" value={costControl} tone={costControl>=60?"good":costControl>=40?"warn":"bad"} />
        </div>
        <div className="card">
          <AnimatedBar label="Risk Management" value={riskManagement} tone={riskManagement>=60?"good":riskManagement>=40?"warn":"bad"} />
        </div>
        <div className="card">
          <AnimatedBar label="Customer Satisfaction" value={customerSat} tone={customerSat>=60?"good":customerSat>=40?"warn":"bad"} />
        </div>
      </div>

      <div className="divider"></div>

      <div className="grid grid-2">
        <div className="card">
          <div className="pill-row"><span className="tag tag-bad">Biggest Mistake</span></div>
          <p className="muted" style={{marginTop:12, lineHeight:1.65, fontSize:14}}>{biggestMistake}</p>
        </div>
        <div className="card">
          <div className="pill-row"><span className="tag tag-good">Best Decision</span></div>
          <p className="muted" style={{marginTop:12, lineHeight:1.65, fontSize:14}}>{bestDecision}</p>
        </div>
      </div>

      <div className="card" style={{marginTop:18}}>
        <div className="pill-row"><span className="tag tag-accent">Expert Recommendation</span></div>
        <p className="muted" style={{marginTop:12, lineHeight:1.65, fontSize:14}}>{expertRecommendation}</p>
      </div>

      <div className="card" style={{marginTop:18}}>
        <h4 style={{marginBottom:14, fontSize:15.5}}>Lessons Learned</h4>
        {lessons.map((l,i) => (
          <div className="log-item" key={i}>
            <span>💡</span>
            <span>{l}</span>
          </div>
        ))}
      </div>

      <div className="card" style={{marginTop:18}}>
        <h4 style={{marginBottom:14, fontSize:15.5}}>Your Decision Trail</h4>
        <div className="log-item"><b>War Room:</b>&nbsp;{warRoom.selectedActions.map(a=>a.title).join(", ")}</div>
        <div className="log-item"><b>Negotiation:</b>&nbsp;Final trust {Math.round(negotiation.negotiationState.trust)}/100, price movement {negotiation.negotiationState.price>0?"+":""}{negotiation.negotiationState.price}%, lead time change {negotiation.negotiationState.leadTime>0?"+":""}{negotiation.negotiationState.leadTime} days</div>
        <div className="log-item"><b>AI Strategy:</b>&nbsp;{ai.aiPicks.map(p=>p.title).join(", ")}</div>
      </div>

      <div className="footer-actions">
        <div className="faint" style={{fontSize:13}}>Thanks for playing, {company.name} leadership team.</div>
        <button className="btn btn-primary" onClick={onReplay}>🔁 Replay with a New Company</button>
      </div>
    </div>
  );
}

/* ============================= APP ROOT ============================= */

function App(){
  const [screen, setScreen] = useState("welcome"); // welcome, company, crisis, warroom, negotiation, boardroom, ai, results
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [warRoomResult, setWarRoomResult] = useState(null);
  const [negotiationResult, setNegotiationResult] = useState(null);
  const [boardroomResult, setBoardroomResult] = useState(null);
  const [aiResult, setAiResult] = useState(null);

  function startSimulation(){
    setCompany(generateCompany());
    setCrisis(generateCrisis());
    setWarRoomResult(null);
    setNegotiationResult(null);
    setBoardroomResult(null);
    setAiResult(null);
    setScreen("company");
  }

  function replay(){
    startSimulation();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  const stepIndexMap = {
    welcome: -1, company:0, crisis:1, warroom:2, negotiation:3, boardroom:4, ai:5, results:6
  };

  return (
    <div className="app-shell">
      {screen !== "welcome" && <TopBar step={stepIndexMap[screen]} />}

      {screen === "welcome" && <Welcome onStart={startSimulation} />}

      {screen === "company" && company && (
        <CompanyReveal company={company} onNext={() => setScreen("crisis")} />
      )}

      {screen === "crisis" && crisis && company && (
        <CrisisReveal crisis={crisis} company={company} onNext={() => setScreen("warroom")} />
      )}

      {screen === "warroom" && (
        <WarRoom
          company={company}
          crisis={crisis}
          onComplete={(res) => { setWarRoomResult(res); setScreen("negotiation"); window.scrollTo({top:0,behavior:"smooth"}); }}
        />
      )}

      {screen === "negotiation" && (
        <Negotiation
          onComplete={(res) => { setNegotiationResult(res); setScreen("boardroom"); window.scrollTo({top:0,behavior:"smooth"}); }}
        />
      )}

      {screen === "boardroom" && (
        <Boardroom
          onComplete={(res) => { setBoardroomResult(res); setScreen("ai"); window.scrollTo({top:0,behavior:"smooth"}); }}
        />
      )}

      {screen === "ai" && (
        <AIStrategy
          onComplete={(res) => { setAiResult(res); setScreen("results"); window.scrollTo({top:0,behavior:"smooth"}); }}
        />
      )}

      {screen === "results" && warRoomResult && negotiationResult && boardroomResult && aiResult && (
        <FinalDashboard
          data={{
            company, crisis,
            warRoom: warRoomResult,
            negotiation: negotiationResult,
            boardroom: boardroomResult,
            ai: aiResult
          }}
          onReplay={replay}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
