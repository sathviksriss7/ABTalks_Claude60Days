<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#efe8d6;
    --paper-dark:#e4dabf;
    --ink:#20242c;
    --ink-soft:#5a5e68;
    --red:#a92a2a;
    --red-dark:#7a1c1c;
    --green:#2f5d44;
    --gold:#a8823a;
    --line:#c9bd9c;
    --white:#fbf8f0;
    --shadow: 0 1px 0 rgba(32,36,44,.08);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  #autopsy-root{
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    background-image:
      radial-gradient(circle at 10% 8%, rgba(169,42,42,.05), transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(47,93,68,.05), transparent 40%);
    min-height: 100vh;
    padding: 0;
    position:relative;
    overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:48px 24px 80px;}
  @media(max-width:600px){.wrap{padding:28px 16px 60px;}}

  /* ---------- shared typography ---------- */
  h1,h2,h3{font-family:var(--serif); margin:0; color:var(--ink);}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--red); font-weight:700; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:''; width:16px; height:1px; background:var(--red);}
  p{line-height:1.6;}
  .muted{color:var(--ink-soft);}

  /* ---------- intro screen ---------- */
  .intro{text-align:center; padding-top:10vh;}
  .stamp-logo{
    display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--red); border:1.5px solid var(--red);
    padding:5px 12px; border-radius:2px; transform:rotate(-3deg); margin-bottom:22px;
  }
  .intro h1{font-size:clamp(38px,7vw,62px); line-height:1.02; font-weight:700; letter-spacing:-.02em;}
  .intro h1 em{font-style:italic; color:var(--red); font-weight:500;}
  .intro p.lede{font-size:18px; color:var(--ink-soft); max-width:480px; margin:22px auto 36px; line-height:1.55;}
  .redline{position:relative; display:inline-block;}

  .btn{
    font-family:var(--sans); font-weight:600; font-size:15px; border:none; cursor:pointer;
    padding:15px 30px; border-radius:3px; background:var(--ink); color:var(--white);
    transition: transform .15s ease, background .15s ease; letter-spacing:.01em;
  }
  .btn:hover{background:var(--red-dark); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .btn.ghost:hover{background:var(--ink); color:var(--white);}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

  /* ---------- wizard ---------- */
  .wizard{max-width:600px; margin:0 auto; padding-top:6vh;}
  .progress{display:flex; gap:6px; margin-bottom:36px; justify-content:center;}
  .progress i{width:26px; height:3px; background:var(--line); border-radius:2px; display:block; transition:background .2s;}
  .progress i.done{background:var(--red);}
  .progress i.active{background:var(--ink);}
  .step{display:none;}
  .step.active{display:block; animation:fadeUp .35s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .qnum{font-family:var(--mono); color:var(--red); font-size:13px; font-weight:700; margin-bottom:10px;}
  .step h2{font-size:26px; font-weight:600; line-height:1.3; margin-bottom:6px;}
  .step .hint{color:var(--ink-soft); font-size:14px; margin-bottom:20px;}
  textarea, input[type=text]{
    width:100%; font-family:var(--sans); font-size:16px; padding:14px 16px;
    border:1.5px solid var(--line); border-radius:4px; background:var(--white);
    color:var(--ink); resize:vertical; line-height:1.5;
  }
  textarea:focus, input:focus{outline:none; border-color:var(--ink);}
  textarea{min-height:110px;}
  .choice-row{display:flex; gap:12px; margin-top:6px; flex-wrap:wrap;}
  .choice{
    flex:1; min-width:140px; border:1.5px solid var(--line); background:var(--white);
    border-radius:4px; padding:16px; cursor:pointer; text-align:left; font-family:var(--sans);
    transition: border-color .15s, background .15s;
  }
  .choice:hover{border-color:var(--ink);}
  .choice.selected{border-color:var(--red); background:#fbeeee;}
  .choice strong{display:block; font-size:15px; margin-bottom:3px;}
  .choice span{font-size:13px; color:var(--ink-soft);}
  .step-actions{display:flex; justify-content:space-between; align-items:center; margin-top:26px;}
  .link-btn{background:none; border:none; color:var(--ink-soft); font-family:var(--sans); font-size:14px; cursor:pointer; text-decoration:underline;}
  .link-btn:hover{color:var(--ink);}

  /* ---------- loading ---------- */
  .loading{text-align:center; padding-top:16vh;}
  .pen{width:64px; height:64px; margin:0 auto 26px; position:relative;}
  .pen svg{width:100%; height:100%; animation:scribble 1.1s ease-in-out infinite;}
  @keyframes scribble{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  .loading .msg{font-family:var(--mono); font-size:13px; color:var(--ink-soft); letter-spacing:.04em;}

  /* ---------- report shell ---------- */
  .report{display:none;}
  .report.active{display:block; animation:fadeUp .4s ease;}
  .report-header{text-align:center; margin-bottom:44px;}
  .report-header h1{font-size:clamp(30px,5vw,44px); font-weight:700; margin:14px 0 6px;}
  .part-divider{margin:64px 0 30px; text-align:center; position:relative;}
  .part-divider::before{content:''; position:absolute; top:50%; left:0; right:0; height:1px; background:var(--line);}
  .part-divider span{
    position:relative; background:var(--paper); padding:0 16px; font-family:var(--mono);
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--red); font-weight:700;
  }

  /* overall stamp */
  .stamp-wrap{display:flex; justify-content:center; gap:28px; align-items:center; margin:30px 0 10px; flex-wrap:wrap;}
  .stamp{
    width:132px; height:132px; border-radius:50%; border:3px solid var(--red); color:var(--red);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-9deg); font-family:var(--mono); position:relative;
  }
  .stamp::before,.stamp::after{content:''; position:absolute; inset:6px; border:1px solid var(--red); border-radius:50%; opacity:.5;}
  .stamp b{font-size:30px; line-height:1;}
  .stamp small{font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin-top:4px;}
  .stamp.after{border-color:var(--green); color:var(--green); transform:rotate(7deg);}
  .stamp.after::before,.stamp.after::after{border-color:var(--green);}
  .arrow-between{font-family:var(--serif); font-size:28px; color:var(--ink-soft); font-style:italic;}

  /* report card rows */
  .card-row{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:22px 24px; margin-bottom:14px;}
  .card-row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:10px;}
  .card-row-top h3{font-size:18px; font-weight:600;}
  .score-pill{
    font-family:var(--mono); font-weight:700; font-size:13px; border:1.5px solid var(--red);
    color:var(--red); border-radius:20px; padding:3px 12px; white-space:nowrap;
  }
  .reaction{font-style:italic; color:var(--ink-soft); font-size:14px; margin-bottom:14px;}
  .callout{display:flex; gap:10px; margin-bottom:8px; font-size:14.5px; line-height:1.55;}
  .callout .ic{flex-shrink:0;}
  .callout b{font-family:var(--sans);}

  /* headline options */
  .hl-grid{display:grid; gap:14px;}
  .hl-card{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:20px 22px;}
  .hl-tag{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); font-weight:700;}
  .hl-text{font-family:var(--serif); font-size:19px; font-weight:600; margin:8px 0 10px; line-height:1.35;}
  .hl-when{font-size:13.5px; color:var(--ink-soft);}

  /* about rebuild */
  .about-block{background:var(--white); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:18px;}
  .about-seg{padding:18px 22px; border-bottom:1px solid var(--line);}
  .about-seg:last-child{border-bottom:none;}
  .about-seg .seg-label{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--red); font-weight:700; margin-bottom:6px;}
  .about-seg p{margin:0; font-size:15px;}
  .kw-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
  .kw{font-family:var(--mono); font-size:12px; background:var(--paper-dark); border:1px solid var(--line); padding:4px 10px; border-radius:12px; color:var(--ink-soft);}

  /* experience before/after */
  .exp-item{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:18px 22px; margin-bottom:12px;}
  .exp-before{color:var(--ink-soft); font-size:14px; text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:1.5px; margin-bottom:10px;}
  .exp-after{font-size:15px; font-weight:500; display:flex; gap:8px;}
  .exp-after::before{content:'→'; color:var(--green); flex-shrink:0;}

  /* skills */
  .skills-cols{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:560px){.skills-cols{grid-template-columns:1fr;}}
  .skill-col h4{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin:0 0 10px;}
  .skill-col.add h4{color:var(--green);}
  .skill-col.remove h4{color:var(--red);}
  .chip{display:inline-block; font-size:13px; padding:5px 11px; border-radius:14px; margin:0 6px 6px 0;}
  .chip.add{background:#e6f0ea; color:var(--green); border:1px solid #bcd9c8;}
  .chip.remove{background:#f5e6e6; color:var(--red); border:1px solid #e3bcbc; text-decoration:line-through;}
  .chip.pin{background:#f4ecd8; color:var(--gold); border:1px solid #e0cd9d; font-weight:700;}
  .pin-row{margin-top:14px;}

  /* scorecard bars */
  .bar-row{margin-bottom:16px;}
  .bar-label{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; font-family:var(--sans); font-weight:600;}
  .bar-track{position:relative; height:8px; background:var(--paper-dark); border-radius:4px; overflow:hidden;}
  .bar-fill{position:absolute; top:0; left:0; height:100%; border-radius:4px; background:var(--red); opacity:.55;}
  .bar-fill.after{background:var(--green); opacity:.85;}
  .bar-nums{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:3px;}

  /* 7 day plan */
  .plan-item{display:flex; gap:18px; margin-bottom:26px; position:relative;}
  .plan-item::before{content:''; position:absolute; left:19px; top:40px; bottom:-26px; width:1px; background:var(--line);}
  .plan-item:last-child::before{display:none;}
  .day-badge{
    flex-shrink:0; width:40px; height:40px; border-radius:50%; background:var(--ink); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:15px;
  }
  .plan-body{flex:1; background:var(--white); border:1px solid var(--line); border-radius:6px; padding:16px 20px;}
  .plan-body h4{font-family:var(--serif); font-size:17px; font-weight:600; margin:0 0 8px;}
  .plan-body ul{margin:6px 0 0; padding-left:18px; font-size:14px;}
  .plan-body .draft{
    background:var(--paper); border-left:3px solid var(--gold); padding:12px 14px; margin-top:10px;
    font-size:14px; white-space:pre-wrap; font-family:var(--sans); line-height:1.55;
  }
  .plan-body .tmpl-label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin-top:10px; display:block;}

  /* summary card */
  .summary-card{
    background:var(--ink); color:var(--white); border-radius:10px; padding:34px 30px; position:relative;
    margin-bottom:20px;
  }
  .summary-card .stamp-logo{border-color:var(--gold); color:var(--gold);}
  .summary-card h3{color:var(--white); font-size:22px; margin:14px 0 18px; line-height:1.35;}
  .summary-scores{display:flex; gap:24px; align-items:baseline; margin-bottom:20px; font-family:var(--mono);}
  .summary-scores .sb{font-size:13px; opacity:.6;}
  .summary-scores .sn{font-size:26px; font-weight:700;}
  .summary-scores .after .sn{color:#8fd6ac;}
  .summary-card ol{padding-left:20px; margin:0 0 18px; font-size:14.5px; line-height:1.7;}
  .summary-card .top-change{font-size:14.5px; padding-top:14px; border-top:1px solid rgba(255,255,255,.15);}
  .summary-card .top-change b{color:var(--gold);}
  .copy-row{display:flex; justify-content:center; margin-top:6px;}
  .copy-row .btn.ghost{color:var(--ink); border-color:var(--ink);}

  .footer-actions{text-align:center; margin-top:56px; padding-top:30px; border-top:1px solid var(--line);}

  .err-box{background:#fbeeee; border:1px solid var(--red); color:var(--red-dark); padding:18px 20px; border-radius:6px; font-size:14px; margin-top:20px;}
</style>

<div id="autopsy-root">
  <div class="wrap">

    <!-- INTRO -->
    <div id="screen-intro" class="intro">
      <div class="stamp-logo">Est. after 50,000 profiles</div>
      <h1>The Profile<br><em>Autopsy.</em></h1>
      <p class="lede">A brutally honest teardown of your LinkedIn — then a full rebuild, a scorecard, and a 7-day plan to make it actually work.</p>
      <div class="btn-row">
        <button class="btn" onclick="Autopsy.start()">Start the autopsy</button>
      </div>
    </div>

    <!-- WIZARD -->
    <div id="screen-wizard" class="wizard" style="display:none;">
      <div class="progress" id="progress"></div>
      <div id="steps"></div>
    </div>

    <!-- LOADING -->
    <div id="screen-loading" class="loading" style="display:none;">
      <div class="pen">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M14 50 L44 20 L52 28 L22 58 L12 58 Z" stroke="#a92a2a" stroke-width="2.5" fill="#fbf8f0"/>
          <path d="M44 20 L52 28" stroke="#a92a2a" stroke-width="2.5"/>
          <path d="M12 58 L18 52" stroke="#a92a2a" stroke-width="2.5"/>
        </svg>
      </div>
      <div class="msg" id="loading-msg">Reading between the lines&hellip;</div>
    </div>

    <!-- REPORT -->
    <div id="screen-report" class="report"></div>

  </div>
</div>

<script>
(function(){

  const QUESTIONS_HAS = [
    {key:'headline', type:'textarea', q:'What\u2019s your current headline?', hint:'Paste it exactly as it appears under your name.'},
    {key:'about', type:'textarea', q:'Paste your About section.', hint:'The whole thing, even if it\u2019s a mess.'},
    {key:'experience', type:'textarea', q:'Your most recent experience entry.', hint:'Title, company, and the bullet points underneath.'},
    {key:'skills', type:'textarea', q:'List your top 5\u201310 skills.', hint:'As they appear on your profile, comma-separated.'},
    {key:'goal', type:'textarea', q:'What\u2019s the goal?', hint:'Landing a job, winning clients, building authority, growing your network \u2014 be specific.'}
  ];

  const QUESTIONS_NONE = [
    {key:'name_role', type:'textarea', q:'Your name, and current role or student status.', hint:'e.g. "Priya Nair, final-year CS student" or "Rahul Dev, freelance product designer."'},
    {key:'skills', type:'textarea', q:'Your top 3 skills.', hint:'Whatever you\u2019re genuinely strongest at.'},
    {key:'achievements', type:'textarea', q:'1\u20132 achievements or projects you\u2019re proud of.', hint:'Numbers or outcomes if you have them.'},
    {key:'audience', type:'textarea', q:'Who do you want to attract?', hint:'Recruiters, clients, collaborators, investors\u2026'},
    {key:'differentiator', type:'textarea', q:'One sentence: what makes you different?', hint:'The thing you\u2019d say if someone asked "why you, not someone else?"'}
  ];

  let state = {hasProfile:null, answers:{}, questions:[], stepIndex:0};

  function el(html){const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild;}
  function esc(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function start(){
    document.getElementById('screen-intro').style.display='none';
    document.getElementById('screen-wizard').style.display='block';
    renderChoiceStep();
  }

  function renderProgress(total, activeIdx){
    const p = document.getElementById('progress');
    p.innerHTML='';
    for(let i=0;i<total;i++){
      const dot = document.createElement('i');
      if(i<activeIdx) dot.className='done';
      else if(i===activeIdx) dot.className='active';
      p.appendChild(dot);
    }
  }

  function renderChoiceStep(){
    renderProgress(6, 0);
    const stepsDiv = document.getElementById('steps');
    stepsDiv.innerHTML = `
      <div class="step active">
        <div class="qnum">QUESTION 0 OF 5</div>
        <h2>Do you already have a LinkedIn profile?</h2>
        <div class="hint">This decides which five questions I ask you next.</div>
        <div class="choice-row">
          <div class="choice" data-v="yes" onclick="Autopsy.pickHas('yes')">
            <strong>Yes, I have one</strong>
            <span>I'll walk you through your current headline, About, experience, skills, and goal.</span>
          </div>
          <div class="choice" data-v="no" onclick="Autopsy.pickHas('no')">
            <strong>No, not yet</strong>
            <span>I'll ask five quick questions instead so we can build one from scratch.</span>
          </div>
        </div>
      </div>`;
  }

  function pickHas(v){
    state.hasProfile = v;
    state.questions = v==='yes' ? QUESTIONS_HAS : QUESTIONS_NONE;
    state.stepIndex = 0;
    renderQuestionStep();
  }

  function renderQuestionStep(){
    const total = state.questions.length;
    renderProgress(total+1, state.stepIndex+1);
    const q = state.questions[state.stepIndex];
    const existing = state.answers[q.key] || '';
    const stepsDiv = document.getElementById('steps');
    stepsDiv.innerHTML = `
      <div class="step active">
        <div class="qnum">QUESTION ${state.stepIndex+1} OF ${total}</div>
        <h2>${esc(q.q)}</h2>
        <div class="hint">${esc(q.hint)}</div>
        <textarea id="ans-input" placeholder="Type your answer\u2026">${esc(existing)}</textarea>
        <div class="step-actions">
          ${state.stepIndex>0 ? `<button class="link-btn" onclick="Autopsy.back()">\u2190 Back</button>` : `<button class="link-btn" onclick="Autopsy.restart()">\u2190 Start over</button>`}
          <button class="btn" id="next-btn" onclick="Autopsy.next()">${state.stepIndex===total-1 ? 'Run the autopsy' : 'Next'}</button>
        </div>
      </div>`;
    document.getElementById('ans-input').focus();
  }

  function next(){
    const q = state.questions[state.stepIndex];
    const val = document.getElementById('ans-input').value.trim();
    if(!val){ document.getElementById('ans-input').style.borderColor='var(--red)'; return; }
    state.answers[q.key] = val;
    if(state.stepIndex < state.questions.length-1){
      state.stepIndex++;
      renderQuestionStep();
    } else {
      runAutopsy();
    }
  }

  function back(){
    state.stepIndex--;
    if(state.stepIndex<0){ renderChoiceStep(); return; }
    renderQuestionStep();
  }

  function restart(){
    state = {hasProfile:null, answers:{}, questions:[], stepIndex:0};
    renderChoiceStep();
  }

  const LOADING_MSGS = ['Reading between the lines\u2026','Circling the weak verbs\u2026','Counting the buzzwords\u2026','Drafting the rebuild\u2026','Stamping the scorecard\u2026'];

  function runAutopsy(){
    document.getElementById('screen-wizard').style.display='none';
    document.getElementById('screen-loading').style.display='block';
    let mi=0;
    const msgEl = document.getElementById('loading-msg');
    const cycle = setInterval(()=>{ mi=(mi+1)%LOADING_MSGS.length; msgEl.textContent = LOADING_MSGS[mi]; }, 1400);

    callClaude(buildPrompt()).then(text=>{
      clearInterval(cycle);
      let json;
      try{
        const cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
        const start = cleaned.indexOf('{');
        const end = cleaned.lastIndexOf('}');
        json = JSON.parse(cleaned.slice(start, end+1));
      }catch(e){
        showError('The rebuild came back in a format I couldn\u2019t parse. This sometimes happens \u2014 try running it again.');
        return;
      }
      renderReport(json);
    }).catch(err=>{
      clearInterval(cycle);
      showError('Something went wrong reaching the analysis engine. Check your connection and try again.');
    });
  }

  function showError(msg){
    document.getElementById('screen-loading').style.display='none';
    document.getElementById('screen-wizard').style.display='block';
    const stepsDiv = document.getElementById('steps');
    stepsDiv.insertAdjacentHTML('beforeend', `<div class="err-box">${esc(msg)}</div><div class="step-actions"><span></span><button class="btn" onclick="Autopsy.next2()">Try again</button></div>`);
  }
  function next2(){ runAutopsy(); }

  function buildPrompt(){
    const a = state.answers;
    let profileBlock;
    if(state.hasProfile==='yes'){
      profileBlock = `The person HAS an existing LinkedIn profile. Their raw input:
- Current Headline: ${a.headline}
- About Section: ${a.about}
- Most Recent Experience Entry: ${a.experience}
- Top Skills: ${a.skills}
- Target Goal: ${a.goal}`;
    } else {
      profileBlock = `The person does NOT have a LinkedIn profile yet. Build one from scratch using only this raw input:
- Name and current role/student status: ${a.name_role}
- Top 3 skills: ${a.skills}
- Achievements/projects they're proud of: ${a.achievements}
- Who they want to attract: ${a.audience}
- What makes them different: ${a.differentiator}`;
    }

    return `You are a LinkedIn Optimization Expert, Personal Branding Consultant, and ex-recruiter who has reviewed 50,000+ profiles. Be direct, specific, and honest like a friend who wants this person to actually succeed \u2014 never generic, never fluffy, never fabricated.

${profileBlock}

RULES:

- If they don't have a profile yet, treat "reportCard", "scorecard" as your assessment of their raw pitch/story materials, and build headline/about/experience as fresh drafts for a new profile (skip inventing an "experience.before" \u2014 in that case set exp before to their raw achievement text and after to the rewritten bullet).

Return ONLY valid JSON (no markdown fences, no prose outside the JSON) matching EXACTLY this schema:

{

 },

  async function callClaude(promptText){
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{role:"user", content: promptText}]
      })
    });
    const data = await response.json();
    if(!data || !data.content) throw new Error('bad response');
    return data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
  }

  function bar(before, after, maxScale){
    const bp = Math.max(4,(before/maxScale)*100);
    const ap = Math.max(4,(after/maxScale)*100);
    return `<div class="bar-track"><div class="bar-fill" style="width:${bp}%"></div></div>
             <div class="bar-track" style="margin-top:4px;"><div class="bar-fill after" style="width:${ap}%"></div></div>`;
  }

  function renderReport(d){
    document.getElementById('screen-loading').style.display='none';
    const r = document.getElementById('screen-report');
    r.classList.add('active');

    let html = '';

    html += `<div class="report-header">
      <div class="eyebrow" style="justify-content:center;">Case File Closed</div>
      <h1>The Autopsy Results</h1>
      <p class="muted">Every section, scored and rebuilt \u2014 in your own words, not invented ones.</p>
    </div>`;

    // PART 1: Report Card
    html += `<div class="part-divider"><span>Part 1 \u2014 The Report Card</span></div>`;
    html += `<div class="stamp-wrap">
      <div class="stamp"><b>${d.overallBefore}</b><small>Before / 100</small></div>
      <div class="arrow-between">&rarr;</div>
      <div class="stamp after"><b>${d.overallAfter}</b><small>After / 100</small></div>
    </div>`;

    (d.reportCard||[]).forEach(sec=>{
      html += `<div class="card-row">
        <div class="card-row-top"><h3>${esc(sec.section)}</h3><span class="score-pill">${sec.score}/10</span></div>
        <div class="reaction">"${esc(sec.reaction)}"</div>
        <div class="callout"><span class="ic">\u274c</span><div><b>The problem: </b>${esc(sec.problem)}</div></div>
        <div class="callout"><span class="ic">\ud83e\udde0</span><div><b>Why it hurts: </b>${esc(sec.why)}</div></div>
        <div class="callout"><span class="ic">\ud83d\udd0d</span><div><b>The invisible cost: </b>${esc(sec.cost)}</div></div>
      </div>`;
    });

    // PART 2: The Rebuild
    html += `<div class="part-divider"><span>Part 2 \u2014 The Rebuild</span></div>`;
    html += `<h3 style="font-size:19px; margin-bottom:12px;">Headline \u2014 3 options</h3><div class="hl-grid">`;
    (d.headlines||[]).forEach(h=>{
      html += `<div class="hl-card"><div class="hl-tag">${esc(h.label)}</div><div class="hl-text">${esc(h.text)}</div><div class="hl-when">${esc(h.when)}</div></div>`;
    });
    html += `</div>`;

    if(d.about){
      html += `<h3 style="font-size:19px; margin:28px 0 12px;">About section \u2014 rewritten</h3>
      <div class="about-block">
        <div class="about-seg"><div class="seg-label">The Hook</div><p>${esc(d.about.hook)}</p></div>
        <div class="about-seg"><div class="seg-label">The Story</div><p>${esc(d.about.story)}</p></div>
        <div class="about-seg"><div class="seg-label">Proof</div><p>${esc(d.about.proof)}</p></div>
        <div class="about-seg"><div class="seg-label">Call to Action</div><p>${esc(d.about.cta)}</p></div>
      </div>
      <div class="kw-list">${(d.about.keywords||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>`;
    }

    if(d.experience && d.experience.length){
      html += `<h3 style="font-size:19px; margin:28px 0 12px;">Experience \u2014 before &rarr; after</h3>`;
      d.experience.forEach(x=>{
        html += `<div class="exp-item"><div class="exp-before">${esc(x.before)}</div><div class="exp-after">${esc(x.after)}</div></div>`;
      });
    }

    if(d.skills){
      html += `<h3 style="font-size:19px; margin:28px 0 12px;">Skills</h3>
      <div class="skills-cols">
        <div class="skill-col add"><h4>Add</h4>${(d.skills.add||[]).map(s=>`<span class="chip add">${esc(s)}</span>`).join('')}</div>
        <div class="skill-col remove"><h4>Remove</h4>${(d.skills.remove||[]).map(s=>`<span class="chip remove">${esc(s)}</span>`).join('') || '<span class="muted" style="font-size:13px;">Nothing to cut</span>'}</div>
      </div>
      <div class="pin-row"><h4 style="font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin-bottom:8px;">Pin to top</h4>${(d.skills.pin||[]).map(s=>`<span class="chip pin">\u2605 ${esc(s)}</span>`).join('')}</div>`;
    }

    // PART 3: Scorecard
    html += `<div class="part-divider"><span>Part 3 \u2014 Before vs After</span></div>`;
    (d.scorecard||[]).forEach(s=>{
      html += `<div class="bar-row">
        <div class="bar-label"><span>${esc(s.section)}</span><span class="muted">${s.before} &rarr; ${s.after}</span></div>
        ${bar(s.before, s.after, 10)}
      </div>`;
    });
    html += `<div class="stamp-wrap" style="margin-top:26px;">
      <div class="stamp"><b>${d.overallBefore}</b><small>Overall Before</small></div>
      <div class="arrow-between">&rarr;</div>
      <div class="stamp after"><b>${d.overallAfter}</b><small>Overall After</small></div>
    </div>`;

    // PART 4: 7-day plan
    html += `<div class="part-divider"><span>Part 4 \u2014 The 7-Day Activation Plan</span></div>`;
    (d.plan||[]).forEach(p=>{
      html += `<div class="plan-item">
        <div class="day-badge">D${p.day}</div>
        <div class="plan-body">
          <h4>${esc(p.title)}</h4>
          ${p.items ? `<ul>${p.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>` : ''}
          ${p.targets ? `<p style="font-size:14px; margin:6px 0 0;">${esc(p.targets)}</p><span class="tmpl-label">Connection message</span><div class="draft">${esc(p.template)}</div>` : ''}
          ${p.content && !p.targets ? (p.day===2 || p.day===5 ? `<span class="tmpl-label">Post draft</span><div class="draft">${esc(p.content)}</div>` : `<p style="font-size:14px; margin:6px 0 0;">${esc(p.content)}</p>`) : ''}
        </div>
      </div>`;
    });

    // PART 5: Summary card
    html += `<div class="part-divider"><span>Part 5 \u2014 Share Card</span></div>`;
    html += `<div class="summary-card">
      <div class="stamp-logo">I let AI roast my LinkedIn</div>
      <h3>Here\u2019s what changed.</h3>
      <div class="summary-scores">
        <div><div class="sb">Before</div><div class="sn">${d.overallBefore}/100</div></div>
        <div class="after"><div class="sb">After</div><div class="sn">${d.overallAfter}/100</div></div>
      </div>
      <div class="sb" style="margin-bottom:6px; opacity:.7;">Top 3 mistakes I was making:</div>
      <ol>${(d.summary && d.summary.mistakes || []).map(m=>`<li>${esc(m)}</li>`).join('')}</ol>
      <div class="top-change"><b>The #1 thing that made the biggest difference:</b><br>${esc(d.summary ? d.summary.topChange : '')}</div>
    </div>
    <div class="copy-row"><button class="btn ghost" onclick="Autopsy.copySummary()" id="copy-btn">Copy summary as text</button></div>`;

    html += `<div class="footer-actions"><button class="btn ghost" onclick="Autopsy.restart2()">Run another autopsy</button></div>`;

    r.innerHTML = html;
    window.__autopsyData = d;
    r.scrollIntoView({behavior:'smooth'});
  }

  function copySummary(){
    const d = window.__autopsyData;
    if(!d) return;
    const mistakes = (d.summary && d.summary.mistakes || []).map((m,i)=>`${i+1}. ${m}`).join('\n');
    const text = `I let AI roast my LinkedIn profile today. Here's what changed:\n\nBefore: ${d.overallBefore}/100\nAfter: ${d.overallAfter}/100\n\nTop 3 mistakes I was making:\n${mistakes}\n\nThe #1 thing that made the biggest difference: ${d.summary ? d.summary.topChange : ''}`;
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.getElementById('copy-btn');
      const old = btn.textContent;
      btn.textContent = 'Copied \u2713';
      setTimeout(()=>{btn.textContent = old;}, 1800);
    });
  }

  function restart2(){
    document.getElementById('screen-report').classList.remove('active');
    document.getElementById('screen-report').innerHTML='';
    state = {hasProfile:null, answers:{}, questions:[], stepIndex:0};
    document.getElementById('screen-wizard').style.display='block';
    renderChoiceStep();
    document.getElementById('screen-wizard').scrollIntoView({behavior:'smooth'});
  }

  window.Autopsy = {start, pickHas, next, back, restart, next2, copySummary, restart2, renderReport};
})();
</script>
